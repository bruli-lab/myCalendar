services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_HOST: ":8080"
      CALLBACK_HOST: ":8081"
      TOKENS_FILE: /data/tokens.json
      NTFY_URL: http://ntfy
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - app-data:/data
    depends_on:
      - ntfy
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3002:3000"
      - "4327:4317"
      - "4328:4318"

  ntfy:
    image: binwiederhier/ntfy:v2.37.2
    command:
      - serve
    ports:
      - "8086:80"
    volumes:
      - ./ntfy/cache:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: http://localhost:8086
      NTFY_AUTH_DEFAULT_ACCESS: read-write

volumes:
  app-data:
