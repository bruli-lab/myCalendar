version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - infra
    - functional

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - revive
    - gocritic
    - bodyclose
    - misspell
    - unconvert
    - gocyclo
    - lll
    - gosec
    - prealloc
    - perfsprint
    - testifylint
    - testpackage
    - paralleltest
    - thelper
    - errorlint
    - noctx
    - durationcheck
    - contextcheck
    - nilnil
    - unparam
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    revive:
      rules:
        - name: unused-parameter
          disabled: false

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style

    gocyclo:
      min-complexity: 15

    lll:
      line-length: 170
      tab-width: 1

    gosec:
      excludes:
        - G104
        - G304
        - G115

    paralleltest:
      ignore-missing: true

    testifylint:
      disable:
        - float-compare
        - error-is-as

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - contextcheck
          - nilnil
      - path: internal/infra/disk/authentication_repository\.go
        text: G117
        linters:
          - gosec
      - path: tests/harness/
        linters:
          - gosec
      - source: "^//go:generate "
        linters:
          - lll

formatters:
  enable:
    - gofumpt

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
